[project]
name = "nightshift"
version = "0.1.0"
description = "Open-source AI on-call engineer: durable multi-agent incident investigation with a trust gate and a public benchmark."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6", "httpx>=0.27", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29",
  "sse-starlette>=2", "temporalio>=1.5", "mcp>=1.0", "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
slack = ["slack-bolt>=1.18"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-grpc>=1.25"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["agents*", "mcp_servers*", "orchestrator*", "gateway*", "slackbot*", "bench*", "chaos*"]
