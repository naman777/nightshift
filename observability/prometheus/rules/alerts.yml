# Thresholds mirror bench/alert_rules.py: a benchmark scenario whose alert never fires is marked INVALID.
groups:
  - name: nightshift-alerts
    rules:
      - alert: HighErrorRate_orders
        expr: max(error_rate{service=~"lb|orders-svc"}) > 0.05
        for: 1m
        labels: {severity: critical, service: orders-svc}
        annotations: {summary: "5xx rate above 5% for orders traffic"}
      - alert: HighLatency_orders
        expr: p99_latency_seconds{service="orders-svc"} > 0.6
        for: 1m
        labels: {severity: critical, service: orders-svc}
        annotations: {summary: "orders-svc p99 latency above 600ms"}
      - alert: ServiceMemoryGrowth
        # Startup warm-up growth must not page: only evaluate once every replica has been up for 45 min, so the warm-up has scrolled
        # out of the 30-minute window (a memory_leak fault injected in the first 45 min after `make up` will not alert).
        expr: (memory_bytes / min_over_time(memory_bytes[30m]) > 1.8) and on(service) (min by (service) (time() - process_start_time_seconds) > 2700)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "memory is 1.8x its 30-minute minimum"}
      - alert: JobQueueBacklog
        expr: queue_depth{service="scheduler"} > 100
        for: 1m
        labels: {severity: critical, service: scheduler}
        annotations: {summary: "scheduler job queue is backing up"}
      - alert: DiskFillingFast
        expr: log_lines_per_second > 400
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "log volume above 400 lines/s (disk filling)"}
