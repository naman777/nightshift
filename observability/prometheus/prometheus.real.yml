# Same as prometheus.yml except the lb job scrapes the real C++ balancer's stats port. Used by docker-compose.real.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: orders-svc
    static_configs:
      - targets: ["orders-svc-1:8080"]
        labels: {service: orders-svc, replica: orders-svc-1}
      - targets: ["orders-svc-2:8080"]
        labels: {service: orders-svc, replica: orders-svc-2}
  - job_name: payments-svc
    static_configs:
      - targets: ["payments-svc:8082"]
        labels: {service: payments-svc, replica: payments-svc-1}
  - job_name: lb
    static_configs:
      - targets: ["lb:8081"]   # the real C++ balancer serves /metrics on its stats port (listen port + 1)
        labels: {service: lb, replica: lb-1}
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:8090"]
        labels: {service: scheduler, replica: scheduler-1}
