# Host-profile Prometheus: black-box probes + node metrics. No change to the monitored app is required.
# `service` labels below are the only per-customer config (generated by `onboard/connect.py` from onboard/host/targets.yaml).
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

rule_files:
  - /__ROOT__/host/rules.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: {service: host}

  # HTTP probe of each service's data path
  - job_name: probe-data
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["http://127.0.0.1:8080/"]
        labels: {service: lb, probe: data}
      - targets: ["http://127.0.0.1:8090/"]
        labels: {service: lb-sandbox, probe: data}
    relabel_configs: &probe_relabel
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "127.0.0.1:9115"}

  # HTTP probe of each service's admin/stats endpoint
  - job_name: probe-admin
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["http://127.0.0.1:8081/stats"]
        labels: {service: lb, probe: admin}
      - targets: ["http://127.0.0.1:8091/stats"]
        labels: {service: lb-sandbox, probe: admin}
    relabel_configs: *probe_relabel

  # TCP connect to each upstream backend
  - job_name: probe-backend
    metrics_path: /probe
    params: {module: [tcp_connect]}
    static_configs:
      - targets: ["127.0.0.1:8001", "127.0.0.1:8002", "127.0.0.1:8003"]
        labels: {service: lb, probe: backend}
      - targets: ["127.0.0.1:8093", "127.0.0.1:8094", "127.0.0.1:8095"]
        labels: {service: lb-sandbox, probe: backend}
    relabel_configs: *probe_relabel

  # the balancer's own /stats JSON (per-backend connections + health), via onboard/lb_stats_exporter.py
  - job_name: lbstats
    honor_labels: true
    static_configs:
      - targets: ["127.0.0.1:9120"]
