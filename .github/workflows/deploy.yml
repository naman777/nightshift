name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nightshift-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure deploy key and pinned host key
        env:
          NIGHTSHIFT_DEPLOY_SSH_KEY: ${{ secrets.NIGHTSHIFT_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$NIGHTSHIFT_DEPLOY_SSH_KEY" > "$HOME/.ssh/nightshift_deploy"
          chmod 600 "$HOME/.ssh/nightshift_deploy"
          cp .github/demo_known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # The host's authorized_keys entry for this key is pinned to ops/ci-deploy.sh, which takes the commit SHA,
      # checks it is still the tip of main, builds, restarts and rolls back on failure. Nothing else can run with it.
      - name: Deploy this commit
        run: |
          ssh -i "$HOME/.ssh/nightshift_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            nkundra_be23@34.180.44.15 "$GITHUB_SHA"
