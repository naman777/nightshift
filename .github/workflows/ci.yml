name: ci

on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly: full benchmark
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  # "Evals as unit tests": a 10-scenario smoke subset gates every PR that can change agent behaviour.
  # Fails if root-cause accuracy drops more than 10 points below bench/baseline.json.
  eval-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: python -m bench.runner --split smoke --config single,multi --repeats 1 --baseline bench/baseline.json --max-drop 0.10
        env:
          NIGHTSHIFT_LLM_PROVIDER: mock
          # to gate on a real model instead: set NIGHTSHIFT_LLM_PROVIDER=anthropic + ANTHROPIC_API_KEY as a repo secret

  # Go is not installed on every dev machine: CI is where the target services and stand-ins are compiled and vetted.
  go:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: target}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.22"}
      - run: go mod tidy
      - run: go build ./...
      - run: go vet ./...

  dashboard:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: npm ci
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  nightly-bench:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: python -m bench.runner --split dev --config all --repeats 3
      - uses: actions/upload-artifact@v4
        with: {name: bench-results, path: bench/results}
