<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" width="640" height="264" font-family="sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="8" y="22" font-size="14" font-weight="bold" fill="#111827">Root-cause accuracy (hard split, 10 scenarios)</text><text x="8" y="55" font-size="12" fill="#374151">Naive: blame last change</text><rect x="210" y="40" width="2" height="22" rx="3" fill="#9ca3af"/><text x="218" y="55" font-size="12" fill="#111827">0%</text><text x="8" y="89" font-size="12" fill="#374151">Naive: blame noisiest service</text><rect x="210" y="74" width="74" height="22" rx="3" fill="#9ca3af"/><text x="290" y="89" font-size="12" fill="#111827">20%</text><text x="8" y="123" font-size="12" fill="#374151">Single agent (all tools)</text><rect x="210" y="108" width="111" height="22" rx="3" fill="#3b82f6"/><text x="327" y="123" font-size="12" fill="#111827">30%</text><text x="8" y="157" font-size="12" fill="#374151">Multi-agent</text><rect x="210" y="142" width="111" height="22" rx="3" fill="#3b82f6"/><text x="327" y="157" font-size="12" fill="#111827">30%</text><text x="8" y="191" font-size="12" fill="#374151">Multi-agent + model routing</text><rect x="210" y="176" width="111" height="22" rx="3" fill="#3b82f6"/><text x="327" y="191" font-size="12" fill="#111827">30%</text><text x="8" y="225" font-size="12" fill="#374151">Multi-agent, no citation rule (ablation)</text><rect x="210" y="210" width="111" height="22" rx="3" fill="#3b82f6"/><text x="327" y="225" font-size="12" fill="#111827">30%</text></svg>